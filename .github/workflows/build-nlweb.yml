name: Atualizar nlweb.js

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Pad
        uses: actions/checkout@v4

      - name: Checkout do nativelayout
        uses: actions/checkout@v4
        with:
          repository: adilson889/nativelayout
          ref: main
          path: nativelayout

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o JS
        run: gradle -p nativelayout/web jsBrowserProductionWebpack

      - name: Copiar o nlweb.js
        run: cp nativelayout/web/build/dist/js/productionExecutable/nlweb.js nlweb.js

      - name: Commit se mudou
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add nlweb.js
          git diff --cached --quiet || git commit -m "Atualizar nlweb.js"
          git push