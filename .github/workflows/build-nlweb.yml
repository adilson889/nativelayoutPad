name: Atualizar nlweb.js

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Pad
        uses: actions/checkout@v4

      - name: Checkout do nativelayout
        uses: actions/checkout@v4
        with:
          repository: getnativelayout/nativelayout
          ref: main
          path: nativelayout

      - name: Copiar o nlweb.js
        run: |
          test -f nativelayout/pad/nlweb.js
          mkdir -p pad
          cp nativelayout/pad/nlweb.js pad/nlweb.js

      - name: Commit se mudou
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pad/nlweb.js
          git diff --cached --quiet || git commit -m "Atualizar nlweb.js"
          git push