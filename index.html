<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#333333" id="tc">
<script>try{var __t=localStorage.getItem("nlpad.theme");document.documentElement.setAttribute("data-theme",__t==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="pad/app-icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="NativeLayoutPad: write a .nl screen and see it live in your browser.">
<title>NativeLayoutPad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='26' fill='%23DFE4EB'/%3E%3Cpath fill='%2344546A' d='M33 70V40h7v3c1.6-2.2 4.8-3.4 8-3.4 7 0 11.5 4.2 11.5 11.2V70h-7V52c0-3.500-2-5.800-5.200-5.800-4.400 0-7.300 2.500-7.300 6.800V70z'/%3E%3Crect x='64' y='28' width='7' height='42' fill='%230C8F65'/%3E%3C/svg%3E">
<link rel="stylesheet" href="pad/base.css">
<link rel="stylesheet" href="pad/ide.css">
</head>
<body data-v="code">
<header class="bar">
  <div class="brand" translate="no"><a href="./" title="nativelayout"><svg width="22" height="22" viewBox="3 3 94 94"><rect x="10" y="10" width="80" height="80" rx="24" fill="#DFE4EB"/><g transform="translate(50 50) scale(1.55) translate(-51 -49.8)"><path fill="#44546A" d="M35 66.7V42.2h6.2v2.4c1.4-1.9 4.3-3 7.1-3 6.2 0 10.2 3.7 10.2 9.9v15.2h-6.2V52.5c0-3.1-1.8-5.1-4.6-5.1-3.9 0-6.5 2.2-6.5 6V66.7z"/><rect x="61.8" y="32.9" width="6.1" height="33.8" fill="#0C8F65"/></g></svg></a><span>native<b>layout</b>Pad</span></div>
  <select id="ex" class="btn" aria-label="Examples"></select>
</header>
<div class="tabs mtabs" id="mt"><div class="tab on" data-v="code">Code</div><div class="tab" data-v="view">Preview</div></div>
<div class="ide">
  <nav class="act" aria-label="Actions">
    <button class="ab on" id="abFiles" title="Explorer"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l5 5v9a1.5 1.5 0 0 1-1.5 1.5H9A1.5 1.5 0 0 1 7.5 17V4.5A1.5 1.5 0 0 1 9 3z"/><path d="M15 3v5h5"/><path d="M5 7.5v11A2.5 2.5 0 0 0 7.5 21H16"/></svg></button>
    <button class="ab" id="abView" title="Preview"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button id="run" class="ab run" title="Run"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    <i class="dv"></i>
    <button class="ab" id="abNew" title="New file"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H7.5A1.5 1.5 0 0 0 6 4.5v15A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M13 3v5h5"/><path d="M12 11.5v5M9.5 14h5"/></svg></button>
    <button class="ab" id="abEx" title="Examples"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h7A1.5 1.5 0 0 1 19 9.5V11"/><path d="M3 7.5V18a1 1 0 0 0 1 1h12.6a1.5 1.5 0 0 0 1.4-1l2.4-6.2a.8.8 0 0 0-.7-1.1H8a1.5 1.5 0 0 0-1.4 1L3 18"/></svg></button>
    <button class="ab" id="abSave" title="Save"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H16l3.5 3.5v13A1.5 1.5 0 0 1 18 21H6.5A1.5 1.5 0 0 1 5 19.5z"/><path d="M8 3v5h7V3M8 21v-6h8v6"/></svg></button>
    <button id="share" class="ab" title="Share"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="18" cy="18" r="2.3"/><path d="M8 11l8-4M8 13l8 4"/></svg></button>
    <i class="dv"></i>
    <button class="ab" id="abDocs" title="Specification"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/></svg></button>
    <button class="ab" id="abHelp" title="Help"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17h.01"/></svg></button>
    <span class="sp"></span>
    <button id="dark" class="ab" title="Preview with the dark theme"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
    <button id="abTheme" class="ab" title="Light or dark theme"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg></button>
  </nav>
  <aside class="tree" id="tree" translate="no">
    <div class="th"><span>EXPLORER</span><button id="tNew" class="tb" title="New file"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H7.5A1.5 1.5 0 0 0 6 4.5v15A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M13 3v5h5"/><path d="M12 11.5v5M9.5 14h5"/></svg></button></div>
    <button class="tsh" id="tsh" type="button"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg><span>PROJECT</span></button>
    <div class="tl" id="tlist"></div>
  </aside>
  <div class="main">
    <div class="pane ed">
      <div class="tabs" id="tabs" translate="no"></div>
      <div class="crumb" id="crumb" translate="no"></div>
      <div class="code" translate="no">
        <div class="gut" id="gut"></div>
        <div class="edw">
          <pre class="hl" id="hl" aria-hidden="true"><code id="hlc"></code></pre>
          <textarea id="ta" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        </div>
      </div>
      <div class="probs" id="probs"></div>
    </div>
    <div class="splitter" id="split" title="Drag to resize"></div>
    <div class="pane pv">
      <div class="pvh"><span>Preview (approximate, the real result is native views)</span><span id="auto" class="eng"></span></div>
      <div class="stage"><div class="phone"><iframe id="fr" title="Preview" sandbox=""></iframe></div></div>
    </div>
  </div>
</div>
<footer class="status" translate="no">
  <span class="si first"><span id="sv" class="sv" translate="no"></span></span>
  <span class="si" id="pb">0 problems</span>
  <button class="si" id="fill" type="button" hidden></button>
  <span class="sp"></span>
  <span id="eng" class="si eng"></span>
  <span class="si" id="pos">Ln 1, Col 1</span>
  <span class="si">UTF-8</span>
  <span class="si">LF</span>
  <span class="si" id="lang">NL</span>
</footer>
<div class="ov" id="dlg" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt">
    <h2 id="dt"></h2>
    <p id="dm"></p>
    <input id="di" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">
    <div class="derr" id="de"></div>
    <div class="dact"><button id="dcn" class="btn" type="button">Cancel</button><button id="dok" class="btn go" type="button">OK</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="pad/nlweb.js"></script>
<script src="pad/auto.js"></script>
<script src="pad/icons.js"></script>
<script src="pad/editor.js"></script>
<script src="pad/ui.js"></script>
<script src="pad/vars.js"></script>
<script src="pad/pwa.js"></script>
</body>
</html>
